# Met le site en ligne à chaque enregistrement (dans le back-office ou sur GitHub).
# Réglage à faire une fois : GitHub > Settings > Pages > Source = « GitHub Actions ».
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - name: Générer le blog
        run: python tools/build_blog.py
      - name: Préparer le site (sans les fichiers de travail)
        run: |
          mkdir _site
          cp -r index.html mentions-legales.html admin assets content css js vendor blog _site/
          cp sitemap.xml robots.txt _site/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
